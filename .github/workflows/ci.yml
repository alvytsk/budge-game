name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: podvinsya
          POSTGRES_PASSWORD: podvinsya
          POSTGRES_DB: podvinsya_test
        # 5434 matches compose.test.yaml and the default in
        # tests/support/db.py, so the suite runs here against the same URL a
        # developer uses locally — no CI-only environment variable to drift.
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U podvinsya -d podvinsya_test"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30

      # §10's «S3-совместимое хранилище медиа». The bucket is created by
      # the test fixture through the S3 API itself, so this needs no init
      # container and no CLI step — which is what lets the same definition
      # serve compose.test.yaml and this block unchanged (the media plan's
      # ruling 9). 9002 matches compose and the default in
      # tests/support/db.py, so no CI-only variable can drift.
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: podvinsya
          MINIO_ROOT_PASSWORD: podvinsya-secret
        ports: ["9002:9000"]
        options: >-
          --health-cmd "mc ready local"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e '.[dev]'

      - name: Lint
        run: ruff check

      - name: Typecheck
        run: mypy

      # The integration suite fails rather than skips when PostgreSQL is
      # unreachable (see tests/db/conftest.py), so a broken service
      # container surfaces here as a failure and not as a green run that
      # proved nothing.
      - name: Test
        run: pytest -q

      # §7.6 and §11: the models and the TypeScript must agree. This step
      # writes nothing — it prints the diff and exits non-zero, so the
      # failure names exactly what drifted and who has to regenerate.
      - name: Contracts
        run: podvinsya export-types --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from `packageManager` in frontend/package.json,
      # so the pin lives in one place and CI cannot drift from the machine.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Build first: it is what regenerates routeTree.gen.ts, and `check`
      # then type-checks against exactly what the build produced.
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test
